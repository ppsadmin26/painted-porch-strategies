name: Site accessibility (axe)

on:
  schedule:
    # 07:45 UTC daily — runs after the B2C nightly so failures are easier to triage.
    - cron: "45 7 * * *"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "tailwind.config.ts"
      - "src/index.css"
      - "e2e/site-a11y.spec.ts"
      - "playwright.config.ts"
      - "playwright-fixture.ts"
      - ".github/workflows/site-a11y.yml"
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run site-wide axe sweep
        run: npm run test:a11y:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-a11y-playwright-report
          path: playwright-report/
          retention-days: 14
