name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Vitest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full Vitest suite
        run: bunx vitest run

  contact-scroll-a11y-regression:
    name: Contact, scroll, and a11y regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run contact/scroll/a11y regression suites
        run: |
          bunx vitest run \
            src/test/contact-and-optin-safety.test.ts \
            src/test/scroll-and-anchor-behavior.test.ts \
            src/test/a11y-key-pages-coverage.test.ts

